<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Collaborative Canvas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="toolbar">
    <input type="color" id="colorPicker" value="#000000" />
    <input type="range" id="brushSize" min="1" max="20" value="4" />

    <button id="brush" class="active">Brush</button>
    <button id="eraser">Eraser</button>
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <button id="clear">Clear</button>
  </div>

  <div id="userPanel">
    <div><strong>Room:</strong> <span id="roomId"></span></div>
    <div><strong>Users Online</strong></div>
    <ul id="userList"></ul>
  </div>

  <canvas id="canvas"></canvas>

  <script src="canvas.js"></script>
</body>
</html>
